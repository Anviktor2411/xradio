name: build

# Tests the plugin without X-Plane, builds it for all three platforms, then
# merges them into a single cross-platform XRadio folder that can be dropped
# straight into X-Plane 12/Resources/plugins/.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  XPMP2_TAG: v3.6.1
  OPUS_TAG: v1.5.2
  MINIAUDIO_TAG: "0.11.25"

jobs:
  # ---------------------------------------------------------------------------
  # The real plugin code linked against a stub X-Plane, run as ordinary
  # executables under AddressSanitizer: against a real server, against a
  # hostile one, through the voice codec, and under odd monitor layouts.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dependencies
        run: bash tools/fetch_deps.sh

      # Instant, and catches the one-platform-only mistakes (MSVC and M_PI,
      # POSIX headers, VLAs) before ten minutes of compiling finds them.
      - name: Portability checks
        run: bash tools/check_portability.sh

      # The Windows build is the one that breaks, because code inside
      # #ifdef _WIN32 is invisible to the other two compilers. Compiling it
      # here, on Linux, finds that in twenty seconds instead of ten minutes.
      - name: The plugin compiles for Windows
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
          bash tools/check_windows_build.sh

      # The tests build with XPMP2 switched off, so the code that actually
      # draws other aircraft is in none of them. Compile it the way the
      # shipped plugin does, for both platforms.
      - name: The CSL bridge compiles against real XPMP2
        run: bash tools/check_xpmp2_build.sh

      - name: Server protocol and routing tests
        run: python3 tools/test_server.py

      - name: C++ and Python wire structs agree
        run: |
          g++ -std=c++17 -Iplugin/src tools/check_sizes.cpp -o /tmp/check_sizes
          /tmp/check_sizes > /tmp/cpp_sizes.txt
          python3 - <<'PY' > /tmp/py_sizes.txt
          import sys; sys.path.insert(0, 'server')
          import protocol as P
          for n in ("HEADER", "LOGIN", "LOGIN_ACK", "LOGIN_REJECT", "POSITION",
                    "TRAFFIC_HDR", "TRAFFIC_ENTRY", "TEXT_HDR", "VOICE_HDR",
                    "WEATHER"):
              print(n, getattr(P, n).size)
          PY
          diff /tmp/cpp_sizes.txt /tmp/py_sizes.txt
          echo "struct layouts match"

      - name: Build the test executables
        run: |
          cmake -B build-tests -DCMAKE_BUILD_TYPE=Debug \
            -DXRADIO_BUILD_TESTS=ON -DXRADIO_USE_XPMP2=OFF \
            -DXPLANE_SDK="$PWD/tools/fake_sdk"
          cmake --build build-tests -j 2

      - name: Position smoothing (reproduces the stutter, proves the fix)
        run: ASAN_OPTIONS=detect_leaks=0 ./build-tests/smoothing_test

      - name: Voice pipeline (Opus, jitter buffer, mixer)
        run: ASAN_OPTIONS=detect_leaks=0 ./build-tests/voice_test

      - name: Window placement across monitor layouts
        run: ASAN_OPTIONS=detect_leaks=0 ./build-tests/placement_test

      - name: Settings window (config file, tabs, every widget)
        run: ASAN_OPTIONS=detect_leaks=0 ./build-tests/settings_test

      - name: Hosting (plugin runs the server, a real peer joins it)
        run: ASAN_OPTIONS=detect_leaks=0 ./build-tests/hosting_test 49640

      # The router-side of hosting, against a fake router that does the
      # awkward things real firmware does, in each of its moods.
      - name: UPnP client against a fake router
        run: |
          for mode in ok lease refuse private-wan deaf; do
            python3 tools/harness/fake_igd.py --mode $mode > /tmp/igd.log 2>&1 &
            sleep 1
            XRADIO_UPNP_GATEWAY=127.0.0.1 ASAN_OPTIONS=detect_leaks=0 ./build-tests/upnp_test $mode
            kill %1 2>/dev/null || true
            wait 2>/dev/null || true
          done

      # The fallback for routers with UPnP switched off, which is the setup
      # nobody has to hand when they need it.
      - name: NAT-PMP fallback against a fake router
        run: |
          for pair in "ok natpmp" "refuse natpmp-refuse" "otherport natpmp-otherport" \
                      "private natpmp-private"; do
            set -- $pair
            python3 tools/harness/fake_natpmp.py --mode $1 > /tmp/pmp.log 2>&1 &
            sleep 1
            XRADIO_UPNP_GATEWAY=127.0.0.1 ASAN_OPTIONS=detect_leaks=0 \
              UBSAN_OPTIONS=halt_on_error=1 ./build-tests/upnp_test $2
            kill %1 2>/dev/null || true
            wait 2>/dev/null || true
          done

      # The update check: the version comparison, and the whole path against
      # a stand-in for GitHub in each of its moods, including down and lying.
      - name: Clipboard (what it copies, and what it refuses)
        run: ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 ./build-tests/clipboard_test

      - name: Update check against a fake release site
        run: |
          ASAN_OPTIONS=detect_leaks=0 ./build-tests/update_test offline
          for mode in newer same older garbage error huge; do
            python3 tools/harness/fake_release.py --mode $mode > /tmp/rel.log 2>&1 &
            rel=$!
            # Wait for the port rather than sleeping and hoping: a runner slow
            # to start Python used to leave the test measuring an absent
            # server, which fails as if the plugin were at fault.
            bash tools/harness/wait_port.sh 5399 20 "$rel" || { cat /tmp/rel.log; exit 1; }
            XRADIO_UPDATE_URL=http://127.0.0.1:5399/latest ASAN_OPTIONS=detect_leaks=0 \
              UBSAN_OPTIONS=halt_on_error=1 ./build-tests/update_test $mode
            # And wait for it to actually go: the next mode binds this port,
            # and if the old server is still on it the new one never starts,
            # leaving the next test talking to the previous mood.
            kill "$rel" 2>/dev/null || true
            wait "$rel" 2>/dev/null || true
          done

      # Two relay servers, one protocol. This drives the same scenarios at
      # both over real UDP and diffs the transcripts, so a validation rule
      # fixed in one and forgotten in the other fails here.
      - name: The Python and built-in servers behave identically
        run: python3 tools/test_server_parity.py --cpp ./build-tests/xradio_server

      - name: Plugin talks to a real server, voice round trip via a peer
        run: |
          python3 tools/harness/fake_release.py --mode newer > /tmp/rel.log 2>&1 &
          rel=$!
          python3 server/server.py --port 49400 > /tmp/srv.log 2>&1 &
          srv=$!
          bash tools/harness/wait_port.sh 5399 20 "$rel" || { cat /tmp/rel.log; exit 1; }
          sleep 1
          python3 tools/fake_client.py --port 49400 --callsign PEER01 \
            --lat 57.86 --lon 27.03 --talk --parrot > /tmp/peer.log 2>&1 &
          peer=$!
          sleep 1
          XRADIO_UPDATE_URL=http://127.0.0.1:5399/latest \
            ASAN_OPTIONS=detect_leaks=0 ./build-tests/plugin_harness 127.0.0.1 49400 CIRUN
          echo "--- server ---"; grep -E "login|voice|text" /tmp/srv.log || true
          echo "--- peer ---";   grep -E "voice" /tmp/peer.log || true
          kill "$rel" "$srv" "$peer" 2>/dev/null || true
          wait "$rel" "$srv" "$peer" 2>/dev/null || true

      # Hosting puts this server on a pilot's home connection, so it gets the
      # same treatment the client gets: malformed packets under ASan/UBSan.
      - name: Hosted server survives a hostile client
        run: |
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-tests/xradio_server 49402 > /tmp/hostsrv.log 2>&1 &
          sleep 1
          python3 tools/harness/fuzz_client.py --port 49402
          kill %1 2>/dev/null || true
          if grep -qiE "ERROR|runtime error" /tmp/hostsrv.log; then
            echo "sanitizer findings:"; cat /tmp/hostsrv.log; exit 1
          fi
          echo "no sanitizer findings"

      - name: Plugin survives a hostile server
        run: |
          python3 tools/harness/fuzz_server.py --port 49401 > /tmp/fuzz.log 2>&1 &
          sleep 1
          ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
            ./build-tests/plugin_harness 127.0.0.1 49401 FUZZCL
          tail -1 /tmp/fuzz.log
          kill %1 2>/dev/null || true

  # ---------------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            platdir: lin_x64
          - os: windows-latest
            name: windows
            platdir: win_x64
          - os: macos-latest
            name: macos
            platdir: mac_x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Portability checks
        shell: bash
        run: bash tools/check_portability.sh

      - name: Fetch dependencies
        shell: bash
        run: bash tools/fetch_deps.sh

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j 2

      - name: Check the plugin was produced
        shell: bash
        run: ls -la build/XRadio/${{ matrix.platdir }}

      # Stage into dist/ so the artifact zip contains an XRadio/ folder.
      # upload-artifact drops the top directory when `path` points straight
      # at it, which would scatter win_x64/ and Resources/ into plugins/.
      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/XRadio dist/XRadio
          cp README.md LICENSE dist/XRadio/
          # The standalone relay server, for anyone who wants one running
          # without X-Plane open. Hosting from inside the sim needs none of
          # this -- it is here for a machine that should stay up.
          mkdir -p dist/XRadio/server/${{ matrix.platdir }}
          for p in build/xradio_server build/xradio_server.exe \
                   build/Release/xradio_server.exe build/Release/xradio_server; do
            if [ -f "$p" ]; then cp "$p" dist/XRadio/server/${{ matrix.platdir }}/; fi
          done
          cp server/server.py server/protocol.py dist/XRadio/server/
          mkdir -p dist/XRadio/Resources/CSL
          cat > dist/XRadio/Resources/CSL/README.txt <<'EOF'
          CSL models go here
          ==================

          XRadio draws other pilots using CSL models in OBJ8 format. Without
          any models installed the plugin still runs, but other aircraft stay
          invisible and Log.txt notes that no models were found.

          Installing a package
          --------------------
          Unpack it so each package sits in its own subfolder here, with its
          xsb_aircraft.txt at the top of that subfolder:

            Resources/CSL/Bluebell/BB_Airbus/xsb_aircraft.txt
            Resources/CSL/Bluebell/BB_Boeing/xsb_aircraft.txt
            Resources/CSL/MyOwnModels/xsb_aircraft.txt

          XRadio scans this whole tree at startup, so several packages can
          live side by side. Restart X-Plane after adding models.

          Where to get them
          -----------------
          Bluebell is free and open, and covers most common types:
            https://github.com/oktalist/BluebellCSL

          Any CSL package built for XPMP2, LiveTraffic or xPilot works here.

          Matching
          --------
          Which model another pilot appears as comes from the "actype" line
          in their xradio.cfg (an ICAO type code such as C172 or A20N). When
          no installed model matches that type, XPMP2 falls back to a related
          type, and failing that to a default model.
          EOF
          ls -R dist | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: XRadio-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Merge the three platform builds into one folder that works everywhere.
  # ---------------------------------------------------------------------------
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect the platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: XRadio-*
          merge-multiple: true
          path: dist

      - name: Verify all three platforms are present
        shell: bash
        run: |
          find dist -maxdepth 3 | sort
          for f in win_x64/XRadio.xpl mac_x64/XRadio.xpl lin_x64/XRadio.xpl; do
            test -f "dist/XRadio/$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All three platforms packaged."

      - uses: actions/upload-artifact@v4
        with:
          name: XRadio-all-platforms
          path: dist
          if-no-files-found: error
